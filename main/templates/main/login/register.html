<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
</head>
<body>
    <h2>Регистрация</h2>
    
    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }}  <!-- автоматически рисует поля: логин, пароль, подтверждение -->
        
        <button type="submit">Зарегистрироваться</button>
    </form>
    
    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    <p><a href="{% url 'index' %}">← На главную</a></p>
</body>
</html>
