<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/css/null.css'%}">
    <link rel="stylesheet" href="{% static 'main/css/font.css'%}">
    <link rel="stylesheet" href="{% static 'main/css/notification.css'%}">
    <title>Document</title>
    
</head>
<body>
    <section class="header-section">
        <nav class="menu-header">
            <div class="logo-header">
                <a href="{% url 'index'%}">
                    <p>Speed & Travel</p>
                </a>
            </div>
            <div class="contact-info">
                <p id="id_reviews">Отзывы</p>
                <p class="about" id="id_aboutUs">О нас</p>
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}">
                        <p class="login-register">Выйти</p>
                    </a>
                {% else %}
                    <a href="{% url 'login' %}">
                        <p class="login-register">Войти</p>
                    </a>
                {% endif  %}
            </div>
        </nav>
    </section>
    <section class="container">
        <div class="left">
            <div class="text">
                <h1>У вас еще нету заявок!</h1>
                <a href="{% url 'index' %}#anchor_tour">
                    <h1 class="h1">Оставить?</h1>
                </a>
            </div>
            <img class="photo1" src="{% static 'main/images/figure6.png' %}">
            <img class="photo2" src="{% static 'main/images/figure7.png' %}">
            <img class="photo3" src="{% static 'main/images/figure8.png' %}">
            <img class="photo4" src="{% static 'main/images/figure9.png' %}">
            <img class="photo5" src="{% static 'main/images/figure10.png' %}">
        </div>
    </section>
</body>
</html>
